  <script>
    // Relaciona cada valor de data-panel con el título que se mostrará en el panel.
    const titles = {
      experience: 'Experience',
      portfolio: 'Proyects',
      skills: 'Skills',
      contact: 'Contact',
      about: 'About Me'
    };

    // Guardan referencias a los elementos HTML que JavaScript actualizará.
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('panel-title');
    const body = document.getElementById('panel-body');

    // Abre el panel correspondiente a la opción seleccionada.
    function openPanel(key) {
      title.textContent = titles[key];

      // Busca la plantilla asociada, copia su contenido y lo inserta en el panel :)
      body.replaceChildren(document.getElementById('tpl-' + key).content.cloneNode(true));

      // Añade la clase CSS que hace visible el panel :]
      overlay.classList.add('open');

      // Deja de esconder el panel
      overlay.setAttribute('aria-hidden', 'false');
    }

    // Cierra el panel que está visible.
    function closePanel() {
      // Elimina la clase CSS que muestra el panel
      overlay.classList.remove('open');

      // Informa a los lectores de pantalla que el panel está oculto
      overlay.setAttribute('aria-hidden', 'true');
    }

    // Busca todos los botones que tienen el atributo data-panel.
    document.querySelectorAll('[data-panel]').forEach(btn =>
      btn.addEventListener('click', () => openPanel(btn.dataset.panel))
    );

    document.getElementById('panel-close').addEventListener('click', closePanel);
    overlay.addEventListener('click', e => { if (e.target === overlay) closePanel(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
  </script>
